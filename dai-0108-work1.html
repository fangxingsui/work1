<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>My Homepage</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body {
            font-family:"Microsoft Yahei",SimSun,sans-serif;
            background-color:#fff7ec; /*页面整体浅米底色*/
            padding:40px 20px;
        }
        /*顶部大标题栏，柔和橙黄色*/
        .header-title {
            background:linear-gradient(90deg,#ffc864,#ffb74d);
            font-size:56px;
            font-weight:bold;
            text-align:center;
            padding:16px 0;
            border-radius:12px;
            box-shadow: 0 4px 8px #00000022;
            margin-bottom:40px;
            color:#222222;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:35px;
            max-width:1200px;
            margin:0 auto;
        }
        .box{
            background:#ffffff;
            border-radius:14px;
            box-shadow:0 3px 10px rgba(0,0,0,0.12);
            overflow:hidden;
        }
        /*板块标题 淡粉橙*/
        .box-title{
            background:linear-gradient(90deg,#ffbfa2,#ffab88);
            font-size:30px;
            text-align:center;
            padding:10px 0;
            color:#222;
        }
        table{
            width:100%;
            border-collapse: collapse;
            font-size:22px;
        }
        td{
            border:1px solid #ffd2bc;
            padding:14px 16px;
        }
        /*表格隔行变色，看着舒服*/
        tr:nth-child(even){
            background-color:#fff3ec;
        }
        .hobby-content{
            font-size:26px;
            padding:30px 25px;
            line-height:2.4;
            color:#333;
        }
        .icon{
            font-size:46px;
            margin:0 10px;
        }
    </style>
</head>
<body>
    <div class="header-title">My Homepage</div>

    <div class="container">
        <!--左侧：关于我-->
        <div class="box">
            <div class="box-title">关于我</div>
            <table>
                <tr>
                    <td>姓名</td>
                    <td>代艳芳</td>
                </tr>
                <tr>
                    <td>性别</td>
                    <td>女</td>
                </tr>
                <tr>
                    <td>学校</td>
                    <td>山东师范大学</td>
                </tr>
                <tr>
                    <td>专业</td>
                    <td>计算机科学与技术</td>
                </tr>
                <tr>
                    <td>爱好</td>
                    <td>追剧、美食、旅行</td>
                </tr>
            </table>
        </div>

        <!--右侧：生活爱好，图标🍨📷🌴-->
        <div class="box">
            <div class="box-title">生活爱好</div>
            <div class="hobby-content">
                <span class="icon">🍨</span>探索美食<br>
                <span class="icon">📷</span>拍摄旅行
                <span class="icon">🌴</span>
            </div>
        </div>
    </div>

</body>
</html>
